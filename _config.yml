title: tutuf
permalink: pretty

logo: images/tutuf_logo.png

header_logo:
  desktop: "images/tutuf_logo_transparent.png"
  desktop_height: "35px"
  desktop_width: "40px"

defaults:
  - scope:
      path: ""
    values:
      layout: "page"

sass:
  style: compressed

plugins:
  - jekyll-mentions
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
