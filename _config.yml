title: tutuf
url: "https://tutuf.com"
permalink: pretty

logo: images/tutuf-logo-512.png

# Listed as tutuf's profiles by jekyll-seo-tag; the first is linked in the sub-footer
social:
  name: tutuf
  links:
    - https://www.linkedin.com/company/tutuf

# Search Console ownership; keep it, Google re-checks it
webmaster_verifications:
  google: CFyGKi1lcTzWr3uzXHqSkPlNbs9tjE-paIQ8EVVobbA

header_logo:
  desktop: "images/tutuf-logo.svg"
  desktop_height: 35
  desktop_width: 40

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
      image:
        path: /images/og-image.jpg
        width: 1200
        height: 630
        alt: "tutuf - Care for what works. Shape what comes next. The engineering partner for the business behind the software."

sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
