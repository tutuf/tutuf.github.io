<div class="sub-footer">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="sub-footer-inner">
          {% if site.data.seo.copyright_text %}
          <div class="copyright">{{ site.data.seo.copyright_text }} · © {{ site.time | date: "%Y" }}</div>
          {% endif %}
          <a class="social" href="{{ site.social.links.first }}" aria-label="tutuf on LinkedIn">{% include linkedin-icon.html %}LinkedIn</a>
        </div>
      </div>
    </div>
  </div>
</div>
