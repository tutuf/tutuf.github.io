<nav id="main-menu" class="main-menu" aria-label="Main">
  {% assign mainmenu = site.data.menus.main | sort: 'weight'  %}
  <ul>
    {% for item in mainmenu %}
    <li class="{% if item.url == page.url %}active{% endif %} {{ item.class }}">
      {% assign first_char = item.url | slice: 0 %}
      <a href="{% if first_char == "#" %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}"{% if item.url == page.url %} aria-current="page"{% endif %}>{{ item.name }}</a>
    </li>
    {% endfor %}
  </ul>
</nav>
